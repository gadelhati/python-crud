
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      UVICORN_JWT_SECRET_KEY: ci-access-secret-key-for-tests-only-2026
      UVICORN_JWT_REFRESH_SECRET_KEY: ci-refresh-secret-key-for-tests-only-2026
      UVICORN_DATABASE_URL: sqlite:///db.sqlite3

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate environment
        run: |
          python -c "from app.config import settings; assert settings.jwt_secret_key.get_secret_value() != settings.jwt_refresh_secret_key.get_secret_value(); print('JWT configuration valid')"

      - name: Run linter
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run Alembic migrations (SQLite)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests (SQLite)
        run: python -m pytest -v

  postgres:
    runs-on: ubuntu-latest

    env:
      UVICORN_JWT_SECRET_KEY: ci-access-secret-key-for-tests-only-2026
      UVICORN_JWT_REFRESH_SECRET_KEY: ci-refresh-secret-key-for-tests-only-2026
      UVICORN_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "psycopg[binary]"

      - name: Validate environment
        run: |
          python -c "from app.config import settings; assert settings.jwt_secret_key.get_secret_value() != settings.jwt_refresh_secret_key.get_secret_value(); print('JWT configuration valid')"

      - name: Run Alembic migrations (PostgreSQL)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests (PostgreSQL)
        run: python -m pytest -v
