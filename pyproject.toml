[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-crud"
version = "1.0.0"
description = "Reusable Python application template built with FastAPI"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "pydantic[email]>=2.14.0,<3.0.0",
    "sqlalchemy>=2.0.41,<3.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "alembic>=1.20.1,<2.0.0",
    "slowapi>=0.1.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "psycopg[binary]>=3.2,<4.0",
    "pytest>=8.3.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "httpx2>=2.0.0,<3.0.0",
    "ruff>=0.8.0,<1.0.0",
    "build>=1.2.0,<2.0.0",
]
performance = [
    "locust>=2.32.0,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "static/**/*",
    "templates/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle e pyflakes (basic errors)
    "I",        # import ordering
    "B",        # bugbear (common bugs)
    "UP",       # syntax modernization
    "N",        # naming convention
    "PT",       # pytest best practices
    "SIM",      # code simplifications
]

[tool.ruff.lint.per-file-ignores]
"app/routers/*.py" = [
    "B008",     # FastAPI-specific configuration
]
"app/models/base.py" = [
    "N805",     # 
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: isolated unit tests",
    "integration: tests integrating API, services, and persistence",
    "e2e: end-to-end application workflows",
    "security: authentication, authorization, and abuse-resistance tests",
    "concurrency: simultaneous operations and transaction-race tests",
    "postgresql: requires PostgreSQL-specific transaction semantics",
    "performance: load/performance tests; normally executed with Locust",
]
