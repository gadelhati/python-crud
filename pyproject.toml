[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-template"
version = "1.0.0"
description = "Reusable Python application template built with FastAPI"
requires-python = ">=3.13,<3.16"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "httpx2>=2.0.0,<3.0.0",
    "ruff>=0.8.0,<1.0.0",
    "build>=1.2.0,<2.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "static/**/*",
    "templates/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F",   # pycodestyle e pyflakes (basic errors)
    "I",        # import ordering
    "B",        # bugbear (common bugs)
    "UP",       # syntax modernization
    "N",        # naming convention
    "PT",       # pytest best practices
    "SIM",      # code simplifications
]