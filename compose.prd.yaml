
services:
  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 9000
      UVICORN_RELOAD: "false"
      UVICORN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  migrate:
    build:
      context: .
      target: production
    env_file:
      - .env.docker
    environment:
      UVICORN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - tools
