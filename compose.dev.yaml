
services:
  api:
    build:
      context: .
      target: development
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      UVICORN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "9000:9000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  migrate:
    build:
      context: .
      target: development
    env_file:
      - .env.docker
    environment:
      UVICORN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - tools
